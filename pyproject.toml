[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# One source of truth for the number. The package exposes __version__, the CLI prints
# it and the HTTP User-Agent carries it, so a second copy here would drift the moment
# one of them was bumped alone.
[tool.hatch.version]
path = "src/newsscore/_version.py"

[project]
name = "newsscore"
dynamic = ["version"]
description = "News sentiment scoring for stocks. Mainstream news APIs in, a pluggable scorer (TypeSafe Jev by default), one score per symbol out."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Huaiyuan Ma", email = "huaiyuanma2003@gmail.com" }]
keywords = ["finance", "news", "sentiment", "jev", "typesafe", "quant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/mahynotch/newsscore"
Repository = "https://github.com/mahynotch/newsscore"
Issues = "https://github.com/mahynotch/newsscore/issues"

[project.optional-dependencies]
# The Jev scorer is the only thing that imports typesafe-sdk; everything else
# (sources, aggregation, the keyword scorer, your own score_fn) works without it.
jev = ["typesafe-sdk>=0.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

# `uv run` / `uv sync` install this group by default, so the Jev SDK and the test
# tools survive syncing. pip users get the same via `pip install ".[jev,dev]"`.
[dependency-groups]
dev = ["typesafe-sdk>=0.6", "pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
newsscore = "newsscore.cli:app"

[tool.hatch.build.targets.sdist]
# Lockfile and design notes are for contributors (in git), not for installers.
exclude = ["uv.lock", "PLAN.md", ".env.example", ".gitattributes", ".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/newsscore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
